<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
    <link rel="icon" href="img/favicon.ico" />
    <link rel="stylesheet" href="style/main.css" />
  </head>
  <body>
    <!--header-->
    <header class="header">
      <a href="./" class="header_logo">
        <img src="img/logo/logo_face.svg" alt="logo_face" />
        <img src="img/logo/logo_text.svg" alt="logo_text" />
      </a>
      <a href="./login.html " class="main-login_btn btn">로그인</a>
    </header>
    <main class="without_header">
      <!--hero_section-->
      <div class="hero_section">
        <div class="hero_section_inner">
          <div class="hero_text">
            <h1 class="title">일상의 모든 물건을 거래해 보세요</h1>
            <a href="./items" class="hero_btn btn">구경하러 가기</a>
          </div>
          <img src="img/main/hero_img.png" alt="hero_image" class="hero_img" />
        </div>
      </div>
      <!--section01-->
      <section>
        <div class="section_inner">
          <img src="img/main/section_01.png" alt="section_01" />
          <div class="section_text">
            <span class="section_theme">Hot Item</span>
            <h2 class="title">인기 상품을<br />확인해 보세요</h2>
            <p class="section_info">
              가장 HOT한 중고거래 물품을 판다 마켓에서 확인해 보세요
            </p>
          </div>
        </div>
      </section>
      <!--section02-->
      <section>
        <div class="section_inner section_inner--reverse">
          <img src="img/main/section_02.png" alt="section_02" />
          <div class="section_text section_text--left">
            <span class="section_theme">Search</span>
            <h2 class="title">구매를 원하는<br />상품을 검색하세요</h2>
            <p class="section_info">
              구매하고 싶은 물품을 검색해서 쉽게 찾아보세요
            </p>
          </div>
        </div>
      </section>
      <!--section03-->
      <section>
        <div class="section_inner">
          <img src="img/main/section_03.png" alt="section_03" />
          <div class="section_text">
            <span class="section_theme">Register</span>
            <h2 class="title">판매를 원하는<br />상품을 등록하세요</h2>
            <p class="section_info">
              어떤 물건이든 판매하고 싶은 상품을 쉽게 등록하세요
            </p>
          </div>
        </div>
      </section>
      <!--footer_hero_section-->
      <div class="hero_section">
        <div class="hero_section_inner">
          <div class="hero_text">
            <h1 class="title">
              믿을 수 있는<br />
              판다마켓 중고 거래
            </h1>
          </div>
          <img
            src="img/main/hero_footer_img.png"
            alt="hero_image"
            class="hero_img"
          />
        </div>
      </div>
    </main>
    <!--footer-->
    <footer class="footer">
      <div class="footer_inner">
        <p class="footer_content footer_content--copyright">
          &copy;codeit - 2024
        </p>
        <ul class="footer_content footer_content--links">
          <li><a href="/privacy">Privacy Policy</a></li>
          <li><a href="/faq">FAQ</a></li>
        </ul>
        <ul class="footer_content footer_content--sns">
          <li>
            <a href="https://www.facebook.com/?locale=ko_KR">
              <img src="img/sns_icon/facebook_icon.svg" alt="facebook_icon" />
            </a>
          </li>
          <li>
            <a href="https://x.com/?lang=ko ">
              <img src="img/sns_icon/twitter_icon.svg" alt="twitter_icon" />
            </a>
          </li>
          <li>
            <a href="https://www.youtube.com/">
              <img src="img/sns_icon/youtube_icon.svg" alt="youtube_icon" />
            </a>
          </li>
          <li>
            <a href="https://www.instagram.com/">
              <img src="img/sns_icon/instagram_icon.svg" alt="instagram_icon" />
            </a>
          </li>
        </ul>
      </div>
    </footer>
  </body>
</html>
