<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
    <link rel="icon" href="img/favicon.ico" />
    <link rel="stylesheet" href="style/style.css" />
    <link rel="stylesheet" href="style/login.css" />
  </head>
  <body>
    <div class="container">
      <a href="./" class="logo">
        <img src="img/logo.svg" alt="logo" />
      </a>
      <form class="form">
        <label for="email">이메일</label>
        <input type="email" id="email" placeholder="입력" required autofocus />
        <label for="password">비밀번호</label>
        <div class="password_wrap">
          <input
            type="password"
            id="password"
            placeholder="비밀번호를 입력해주세요"
            required
          />
          <button type="button" class="password_icon">
            <img
              src="img/icon/password_hidden_icon.svg"
              alt="password_hidden_icon"
            />
          </button>
        </div>
        <button type="submit" class="submit_btn btn">로그인</button>
      </form>
      <!--social_login-->
      <div class="social_login">
        <span>간편 로그인하기</span>
        <div class="social_login_btn">
          <a href="https://www.google.com/">
            <img src="img/sns_icon/google_icon.svg" alt="google" />
          </a>
          <a href="https://www.kakaocorp.com/page/">
            <img src="img/sns_icon/kakao_icon.svg" alt="kakao" />
          </a>
        </div>
      </div>
      <!--go_to_signup-->
      <div class="go_signup">
        <span>판다마켓이 처음이신가요?</span>
        <a href="./signup.html" class="signup_btn">회원가입</a>
      </div>
    </div>
  </body>
</html>
