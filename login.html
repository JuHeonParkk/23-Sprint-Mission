<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="style/global.css" />
    <link rel="stylesheet" href="style/style.css" />
    <link rel="stylesheet" href="style/login.css" />
  </head>
  <body>
    <div class="login_container">
      <a href="./" class="logo">
        <img src="img/logo.svg" alt="logo" />
      </a>
      <form class="login_form">
        <label>이메일</label>
        <input type="email" placeholder="입력" />
        <label>비밀번호</label>
        <input type="password" placeholder="비밀번호를 입력해주세요" />
        <button type="submit" class="login_btn btn">로그인</button>
      </form>
      <!--social_login-->
      <div class="social_login">
        <span>간편 로그인하기</span>
        <div class="social_login_btn">
          <a href="https://www.google.com/">
            <img src="img/sns_icon/google_icon.svg" alt="google" />
          </a>
          <a href="https://www.kakaocorp.com/page/">
            <img src="img/sns_icon/kakao_icon.svg" alt="kakao" />
          </a>
        </div>
      </div>
      <!--go_to_signup-->
      <div class="go_signup">
        <span>판다마켓이 처음이신가요?</span>
        <a href="./signup" class="signup_btn">회원가입</a>
      </div>
    </div>
  </body>
</html>
